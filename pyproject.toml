[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webtracker"
version = "0.1.0"
description = "Generic autonomous web research and tracking system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "python-telegram-bot>=21,<23",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
webtracker = "webtracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webtracker = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
